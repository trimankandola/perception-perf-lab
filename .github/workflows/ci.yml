name: ci
on: [push, pull_request]

jobs:
  build-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sanitize: ["", "address", "thread"]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtest-dev libbenchmark-dev
      - name: Allow ThreadSanitizer on newer kernels
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Configure
        run: cmake -S . -B build -G Ninja -DPPL_SANITIZE=${{ matrix.sanitize }}
      - name: Build
        run: cmake --build build
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - name: Smoke run
        run: mkdir -p results && ./build/ppl_run --frames 100 --warmup 10 --csv results/ci.csv